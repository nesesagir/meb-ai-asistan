# PC kapaliyken calisma: bunu bir VPS'e (DigitalOcean, Hetzner, Contabo...) kur.
# ESP32 Wi-Fi'den bu sunucunun IP/domain adresine baglanir.
#
# Kullanim (VPS'te):
#   1) .env dosyasina GROQ_API_KEY yaz
#   2) Qdrant snapshot'i yukle (asagidaki volume)
#   3) docker compose up -d
#   4) Guvenlik duvari: 8001 ve (gerekirse) 6333 ac
#   5) Cihazda WiFi sayfasinda Sunucu IP = VPS public IP, Port = 8001

services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: .
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      # Compose aginda Qdrant servis adi
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant

volumes:
  qdrant_data:
